- insert:
    - id: speech-to-text
      name: '@deepseek-ai/dsh-experimental-speech-to-text'
      config:
        defaultProvider: sensevoice-local
    - id: speech-to-text-sensevoice
      name: '@deepseek-ai/dsh-experimental-speech-to-text-sensevoice'
      config:
        dataRoot: !!js dshHomePath('speech-to-text', 'sensevoice')
    - id: api-speech-to-text
      name: '@deepseek-ai/dsh-experimental-api-speech-to-text'
    - id: text-to-speech
      name: '@deepseek-ai/dsh-experimental-text-to-speech'
      config:
        # Quote ternary expressions: a plain YAML scalar stops at ": ", which
        # would parse the branches as a mapping instead of one expression.
        defaultProvider: !!js "process.platform === 'darwin' ? 'macos-say' : 'kokoro-local'"
        defaultVoice: !!js "process.platform === 'darwin' ? 'Tingting (中文（中国大陆）)' : 'zf_xiaobei'"
        language: auto
    - id: text-to-speech-kokoro
      name: '@deepseek-ai/dsh-experimental-text-to-speech-kokoro'
      config:
        dataRoot: !!js dshHomePath('text-to-speech', 'kokoro')
    - id: text-to-speech-macos
      name: '@deepseek-ai/dsh-experimental-text-to-speech-macos'
      disabled: !!js process.platform !== 'darwin'
    - id: api-text-to-speech
      name: '@deepseek-ai/dsh-experimental-api-text-to-speech'
    - id: ui-voice-conversation
      name: '@deepseek-ai/dsh-experimental-client-ui-voice-conversation'
